name: shopflow

services:
  airflow-db:
    image: postgres:16
    container_name: shopflow-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    networks: [shopflow-net]

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: shopflow-airflow-init
    depends_on: [airflow-db]
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname Ziyodbek --lastname Admin --role Admin --email admin@example.com"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [shopflow-net]

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: shopflow-airflow-webserver
    depends_on: [airflow-init]
    environment: *airflow-env
    command: webserver
    ports:
      - "8088:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [shopflow-net]

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: shopflow-airflow-scheduler
    depends_on: [airflow-init]
    environment: *airflow-env
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [shopflow-net]

volumes:
  airflow-db-data: